name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Unsigned: electron-builder.yml ad-hoc signs (identity "-") and skips
      # notarization, so no Apple secrets are needed.
      - run: npx electron-builder --mac --universal --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/latest.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # rpmbuild is required to emit .rpm on the Ubuntu runner; deb tooling ships with the image.
      - name: Install RPM build tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npx electron-builder --linux AppImage deb rpm --publish never

      - uses: actions/upload-artifact@v6
        with:
          name: linux-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # The install scripts ship with every release, next to what they
      # download: `…/releases/latest/download/install.sh` is the one install
      # path on all three platforms, and it reads the manifests below.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: install
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # The latest*.yml manifests are what electron-updater reads from the
      # release assets; the installers are what users download.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/latest-mac.yml
            artifacts/latest.yml
            artifacts/latest-linux.yml
            install/install.sh
            install/install.ps1
          generate_release_notes: true
